<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b52"><title>Create account | Uganda Revision Hub</title><link rel="stylesheet" href="site-pages.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html">📚 Uganda Revision Hub<small>Learn. Practise. Achieve.</small></a><nav class="header-links"><a href="index.html">Home</a><a href="signin.html">Sign in</a></nav></div></header><main><section class="panel"><h1>Create your learner account</h1><p class="muted">Use an email address you can access. Choose a strong password and do not share it.</p><form id="signupForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password (at least 6 characters)</label><input id="password" type="password" minlength="6" autocomplete="new-password" required><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required><div class="form-actions"><button id="signupButton" type="submit">Create account</button></div></form><p id="status" class="status" role="status">Fill in the form to create your account.</p><p>Already registered? <a href="signin.html">Sign in</a>.</p></section></main><footer class="site-footer"><p><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="cookies.html">Cookies</a></p><p>© 2026 Uganda Revision Hub</p></footer><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,sendEmailVerification}from"https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";const app=initializeApp({apiKey:"AIzaSyDqOMC01ll0gKLg-I6loNFLwRJIu10zxw4",authDomain:"uganda-revision-hub.firebaseapp.com",projectId:"uganda-revision-hub",storageBucket:"uganda-revision-hub.firebasestorage.app",messagingSenderId:"517472799476",appId:"1:517472799476:web:f1af0ee208fe8cd3d86ca1",measurementId:"G-23CZXS9G5C"});const auth=getAuth(app);const form=document.getElementById('signupForm'),status=document.getElementById('status'),button=document.getElementById('signupButton');form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;if(password!==confirm){status.textContent='The passwords do not match.';return}button.disabled=true;status.textContent='Creating your account…';try{const cred=await createUserWithEmailAndPassword(auth,email,password);try{await sendEmailVerification(cred.user);status.textContent='Account created. Check your email for a verification link, then sign in.'}catch(e){status.textContent='Account created. Email verification could not be sent right now; you can sign in.'}form.reset()}catch(err){const messages={'auth/email-already-in-use':'An account already exists for this email. Try signing in.','auth/invalid-email':'Enter a valid email address.','auth/weak-password':'Choose a stronger password of at least 6 characters.','auth/operation-not-allowed':'Email/password sign-up is not enabled in Firebase Authentication. Contact the site administrator.','auth/network-request-failed':'Network error. Check your connection and try again.'};status.textContent=messages[err.code]||'Account creation failed. Please try again. ('+err.code+')'}finally{button.disabled=false}});</script></body></html>
